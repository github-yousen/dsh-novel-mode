# 小说工作台 (Novel Workbench)
#
# ONE Host row. The engine is a deterministic JS state machine in
# lib/orchestrator.js, driven through the `novel_orchestrate` agent tool and a
# Client-callable Host HTTP route (both call the same `drive()` function).
# The Client half (client.js) registers a `sidebar.panellist` row and a `main`
# keyed panel — the "小说工作台" — as the sole user-facing control surface.
# There is NO agent preset, NO mode dropdown entry, NO persona prose and NO
# workflow prompt shown to the user. Skills are registered from the package's
# own assets/.dsh/skills/ and are model-invocable only (never user-invocable).

- insert:
    - id: novel-mode
      name: '@yousen/dsh-novel-mode'
