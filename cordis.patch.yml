# 小说模式 (Novel Mode)
#
# ONE Host row providing the bundled skills, plus ONE Agent-preset declaration
# that adds "小说模式" as a selectable entry in the session's mode dropdown.
# The preset is a declarative @deepseek-ai/dsh-agent-preset row; no custom
# button, slash command, tool, or prompt injection is contributed.
#
# The preset's plugin list mirrors the shipped `standard` preset (so the model
# has file, shell, skill, subagent and web tools), plus a persona that tells the
# model it is in Novel Mode. Workflow execution is skill-driven: the model loads
# the matching `novel-*` skill from the / menu when the user describes the task.

- insert:
    - id: novel-mode
      name: '@yousen/dsh-novel-mode'

    - id: preset-novel
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: novel
        name: 小说模式
        description: 长篇小说工业化写作工作流：宪法、大纲、设计稿、正文、批量写作与全书校验，内置技能、子代理角色与校验脚本。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                你正处于「小说模式」。当前项目根目录的 .dsh/ 已就绪：包含长篇小说写作工作流所需的技能（novel-*）、子代理角色（agent-*）、模板、校验脚本与 config.yaml。
                当用户要写小说、做设定、扩纲、设计章节、写正文、批量写作或校验时，用 skill 工具加载匹配的 novel-* 技能，并严格按其正文执行；
                需要独立上下文时用 subagent 工具加载对应的 agent-* 技能。脚本一律以 `pwsh -NoProfile -File .dsh/scripts/<name>.ps1` 方式执行，禁止 -Command。
                遵循 .dsh/AGENTS.md 的全部铁律（章节三位补零、先设计稿后正文、每章验证并同步状态、中文双引号、去AI味等）。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
