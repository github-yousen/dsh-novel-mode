# 工作流全局配置（母本 .dsh/config.yaml）
# 随 .dsh 同步到所有小说项目子目录，各项目统一生效
# 修改本文件后，各项目脚本立即读取，无需改动命令/脚本/模板
# 🔴 若某字段缺省，脚本与命令回退到内置默认值（min=2000 / target=2500 / max=3500）

# 章节正文字数约束（不含标题）
wordCount:
  min: 2000      # 单章正文字数下限
  target: 2500   # 写作目标字数（中位数）
  max: 3500      # 单章正文字数上限

# 长期记忆分层（供 build-context-bundle.ps1 嵌入"远期记忆索引"时裁剪体积）
# 记忆结构：N-2~N-10 完整摘要 → N-11~N-20 压缩段 → 1~N-21 远期索引（本段配置）
memory:
  farIndexFullChapters: 40   # 自 N-21 向前，保留"完整一句话剧情"的章数
  oldIndexCharLimit: 30      # 更早章节的一句话剧情截断字数
  lexiconMaxEntries: 150     # 专名/细节词表最多嵌入条数（按章节由早到晚取最近的）

# 深度语义审查（continuity-validator 那套审计）的执行方式 —— 由本段决定，不再靠命令参数区分
#   subagent : 启动 SubAgent continuity-validator，在独立上下文审计（与写作隔离，不受"自己审自己"影响；更慢、更费 token）
#   inline   : 主会话自己执行同一套审计——以 .dsh/agents/continuity-validator.md 的
#              <context_loading>/<checks>/<severity>/<output_format> 为唯一清单（快、省；但与写作同一上下文）
# 🔴 缺省或值非法 → 按 subagent 执行（兼容旧行为）
# 🔴 subagent 模式下 SubAgent 不可用（未注册 / 调用报错 / 无返回）→ 自动降级为 inline，并在报告中注明降级原因
# 🔴 只影响下列三个审查点；/novel-batch 与 /novel-validate 不读本段，仍固定调用 SubAgent
review:
  design: inline    # /novel-design N    步骤 4.5 设计稿语义校验（stage=design）
  outline: inline   # /novel-design all / all --extend  步骤 4.6 大纲语义评审（stage=outline）
  chapter: inline   # /novel-write N     Step 9 深度连续性校验（stage=chapter-full）

# 可选扩展（后续如需配置化其他项，追加到本文件即可）
# checkpointInterval: 10   # 批量写作检查点间隔（章）
